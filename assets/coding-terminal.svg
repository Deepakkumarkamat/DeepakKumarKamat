<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blobGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7f5af0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2cb67d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2cb67d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15152a"/>
      <stop offset="100%" stop-color="#1c1c35"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f5af0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7f5af0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2cb67d" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;140%" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;240%" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- floating background glow blobs -->
  <circle cx="90" cy="70" r="95" fill="url(#blobGrad1)" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 18,14; -8,22; 0,0" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="545" cy="300" r="110" fill="url(#blobGrad2)" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -16,-10; 10,-20; 0,0" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal card -->
  <rect x="40" y="50" width="540" height="270" rx="18" fill="url(#cardGrad)" stroke="#2a2a45" stroke-width="1.5"/>

  <!-- window dots -->
  <circle cx="66" cy="76" r="6" fill="#ff5f57"/>
  <circle cx="86" cy="76" r="6" fill="#febc2e"/>
  <circle cx="106" cy="76" r="6" fill="#28c840"/>
  <text x="130" y="81" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8a8aa3">deepak.js</text>

  <!-- shimmering divider -->
  <rect x="56" y="94" width="508" height="1.5" fill="url(#shimmerGrad)"/>

  <!-- typed code lines -->
  <g font-family="Menlo, Consolas, 'Fira Code', monospace" font-size="14">

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="64" y="120"><tspan fill="#ff7edb">const</tspan><tspan fill="#f8f8f2"> deepak = {</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.11;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="80" y="142"><tspan fill="#8be9fd">location</tspan><tspan fill="#f8f8f2">: </tspan><tspan fill="#a6e22e">"India 🇮🇳"</tspan><tspan fill="#f8f8f2">,</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.19;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="80" y="164"><tspan fill="#8be9fd">role</tspan><tspan fill="#f8f8f2">: </tspan><tspan fill="#a6e22e">"Full Stack MERN Developer"</tspan><tspan fill="#f8f8f2">,</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.28;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="80" y="186"><tspan fill="#8be9fd">currentFocus</tspan><tspan fill="#f8f8f2">: </tspan><tspan fill="#a6e22e">"Client projects @ an IT Company"</tspan><tspan fill="#f8f8f2">,</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.37;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="80" y="208"><tspan fill="#8be9fd">learning</tspan><tspan fill="#f8f8f2">: </tspan><tspan fill="#a6e22e">"Machine Learning"</tspan><tspan fill="#f8f8f2">,</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.46;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="80" y="230"><tspan fill="#8be9fd">funFact</tspan><tspan fill="#f8f8f2">: </tspan><tspan fill="#a6e22e">"I turn coffee into code ☕ → 💻"</tspan><tspan fill="#f8f8f2">,</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.55;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="80" y="252"><tspan fill="#8be9fd">hobby</tspan><tspan fill="#f8f8f2">: </tspan><tspan fill="#a6e22e">"Gaming 🎮 in my free time"</tspan><tspan fill="#f8f8f2">,</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.63;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="80" y="274"><tspan fill="#8be9fd">motto</tspan><tspan fill="#f8f8f2">: </tspan><tspan fill="#a6e22e">"Build fast. Break things. Ship better."</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.70;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
      <text x="64" y="296"><tspan fill="#f8f8f2">};</tspan></text>
    </g>

  </g>

  <!-- blinking cursor -->
  <rect x="90" y="284" width="8" height="14" fill="#7f5af0" opacity="0">
    <animate attributeName="opacity"
      values="0;0;1;0;1;0;1;0;1;0;0;0"
      keyTimes="0;0.70;0.72;0.75;0.78;0.81;0.84;0.87;0.90;0.93;0.96;1"
      dur="10s" repeatCount="indefinite"/>
  </rect>

</svg>
